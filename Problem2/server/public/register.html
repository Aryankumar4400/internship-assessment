<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center;}
    .card{background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.08);padding:24px;width:360px;}
    h1{margin:0 0 16px;font-size:20px;}
    label{display:block;margin-top:10px;font-size:13px;color:#333;}
    input{width:100%;padding:10px;margin-top:6px;border:1px solid #d9d9e3;border-radius:10px;}
    button{margin-top:16px;width:100%;padding:10px;border:0;border-radius:10px;background:#4f46e5;color:#fff;font-weight:700;cursor:pointer;}
    .links{margin-top:12px;font-size:13px;display:flex;justify-content:space-between;}
    .msg{margin-top:12px;color:#b00020;font-size:13px;min-height:18px;}
    a{color:#4f46e5;text-decoration:none;}
    a:hover{text-decoration:underline;}
  </style>
</head>
<body>
  <div class="card">
    <h1>Registration</h1>

    <label>Name</label>
    <input id="name" type="text" placeholder="Your name" />

    <label>Email</label>
    <input id="email" type="email" placeholder="you@example.com" />

    <label>Password</label>
    <input id="password" type="password" placeholder="At least 6 characters" />

    <button id="registerBtn">Register</button>

    <div class="msg" id="msg"></div>

    <div class="links">
      <span>Already have an account?</span>
      <a href="/login">Login</a>
    </div>
  </div>

<script>
  function showMsg(text){
    document.getElementById("msg").textContent = text || "";
  }

  document.getElementById("registerBtn").addEventListener("click", async () => {
    showMsg("");
    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const res = await fetch("/api/auth/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, email, password })
    });

    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      showMsg(data.error || "Registration failed");
      return;
    }

    showMsg("Registered successfully. Redirecting to login...");
    setTimeout(() => window.location.href = "/login", 900);
  });
</script>
</body>
</html>
